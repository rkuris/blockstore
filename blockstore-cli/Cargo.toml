[package]
name = "blockstore-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true
repository = "https://github.com/rkuris/blockstore"
description = "A tool to import blocks from LevelDB into blockstore"
keywords = ["blockchain", "blockstore", "blockchain-storage"]
categories = ["database-implementations"]

[dependencies]
blockstore = { path = "../blockstore", version = "0.5.0", package = "blockdb" }
clap = { version = "4.6.6", features = ["derive"] }
pretty-hex = "0.4.2"
# Only needed by the `import` subcommand. Kept optional so a default build
# (and `cargo install blockstore-cli`) doesn't pull in leveldb-sys, whose
# upstream crates.io release doesn't build on modern toolchains.
leveldb = { version = "0.8.6", optional = true }
# Pinned to 0.0.5 to match what leveldb 0.8.6 links against: bumping it
# puts two db-key versions in the graph, and `LevelDBKey` then implements a
# `db_key::Key` that `Database::iter` does not accept.
db-key = { version = "0.0.5", optional = true }
rlp = { version = "0.6.1", optional = true }

[features]
# Enables the `import` subcommand (reads blocks from an avalanchego LevelDB).
import = ["dep:leveldb", "dep:db-key", "dep:rlp"]

[lints]
workspace = true
