[package]
name = "blockstore_ffi"
version = "0.1.0"
edition = "2024"
description = "A simple blockchain block store in Rust"
authors = ["Ron Kuris <swcafe@gmail.com>"]
keywords = ["blockchain", "blockstore", "blockchain-storage"]
categories = ["database-implementations"]
repository = "https://github.com/rkuris/blockstore"
license-file = "LICENSE.md"
readme = "README.md"

[lib]
crate-type = ["staticlib"]

[dependencies]
bytemuck = { version = "1.13.1", features = ["derive"] }
fxhash = "0.2.1"

[dev-dependencies]
tempfile = "3.19.1"
more-asserts = "0.3.1"

[build-dependencies]
cbindgen = "0.28.0"

[lints.clippy]
pedantic = "warn"
all = "warn"
cargo = "warn"
absolute-paths = "warn"
arithmetic-side-effects = "warn"
indexing-slicing = "warn"
get-unwrap = "warn"
exit = "warn"
dbg-macro = "warn"
decimal-literal-representation = "warn"

