[package]
name = "blockdb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true
description = "A simple blockchain block store in Rust"
keywords = ["blockchain", "blockstore", "blockchain-storage"]
categories = ["database-implementations"]
repository = "https://github.com/rkuris/blockstore"

# Published to crates.io as `blockdb`, but the library is still imported as
# `blockstore` everywhere (code, dependents, benches/tests) via this lib name.
[lib]
name = "blockstore"

[dependencies]
bytemuck.workspace = true
lru-mem = "0.3"
parking_lot = "0.12"
strum.workspace = true
xxhash-rust.workspace = true
snap = { version = "1.1", optional = true }
zstd = { version = "0.13.3", optional = true }
metrics = { version = "0.24.6", optional = true }

[dev-dependencies]
tempfile.workspace = true
more-asserts.workspace = true
criterion.workspace = true
pprof.workspace = true

[features]
default = [ "zstd" ]
metrics = ["dep:metrics"]
zstd = ['dep:zstd']
snappy = ['dep:snap']

[[bench]]
name = "bench"
harness = false

[lints]
workspace = true
